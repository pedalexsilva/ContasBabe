ext {
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'

    // Sem isto o @capacitor-firebase/authentication declara as bibliotecas do
    // Google Sign-In como compileOnly e elas NÃO entram no APK. Como o
    // capacitor.config.ts declara o provider 'google.com', o plugin instancia o
    // GoogleAuthProviderHandler no load() e a app rebenta com
    // NoClassDefFoundError logo no arranque — não no clique do login.
    rgcfaIncludeGoogle = true
}